version: '3.8'

services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: servicehub_backend
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./ServiceHub
      dockerfile: Dockerfile
    container_name: servicehub_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend