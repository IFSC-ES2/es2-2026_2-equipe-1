version: '3.8'

services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: servicehub_backend
    ports:
      - "8080:8080"
    environment:
      - PORT=3000
      - NODE_ENV=development

  frontend:
    build:
      context: ./ServiceHub
      dockerfile: Dockerfile
    container_name: servicehub_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./ServiceHub:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend