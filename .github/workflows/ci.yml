name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check_files:
    name: Verificar arquivos básicos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          test -f README.md
          test -f USO-IA.md
          test -f docs/entregas/sprint-3-planejamento.md
          test -f docs/ARQUITETURA.md
          test -f docs/REENGENHARIA.md
          test -f docs/METRICAS.md
          test -f docs/riscos.md
          test -f docs/qualidade.md
          test -f docs/adrs/ADR-0005-evolucao-arquitetura-negociacao.md

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Test backend
        working-directory: back-end
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Publicar relatório JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: back-end/build/reports/jacoco/test/html

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ServiceHub/package-lock.json

      - name: Install dependencies
        working-directory: ServiceHub
        run: npm ci

      - name: Build frontend
        working-directory: ServiceHub
        run: npm run build

      - name: Test frontend
        working-directory: ServiceHub
        run: npm test -- --run

      - name: Lint frontend
        working-directory: ServiceHub
        run: npm run lint

  configuration:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config --quiet
